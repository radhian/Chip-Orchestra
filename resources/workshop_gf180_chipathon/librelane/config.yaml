# GF180 Chipathon Workshop — LibreLane Chip flow configuration
#
# Golden test fixture (matches src/chip_top.sv exactly):
#   30 analog + 20 bidirectional + 4 DVDD + 4 DVSS + 2 input = 60 I/O pads
#   + 4 corner pads, distributed South 16 / East 12 / North 16 / West 16.
#
# This is the WORKSHOP-SPECIFIC configuration.  Generic Chip Orchestra
# pad-ring configs are parameterized by the user's actual I/O requirements.

meta:
  flow: Chip
  version: 2

DESIGN_NAME: chip_top

# ---------------------------------------------------------------------------
# Pad-ring <-> core power strap (adopted from the sscs-chipathon-2026 workshop).
# The single 5V digital domain is VDD/VSS (chip_top.sv ties every pad
# VDD/DVDD -> VDD and VSS/DVSS -> VSS). A Metal2/Metal3 core ring is generated
# and CONNECTED TO THE PADS so the pad-ring power is physically strapped into the
# core PDN — the piece this fixture previously omitted, which left LVS with
# residual pad-ring<->core power mismatches.
PDN_MULTILAYER: true
VDD_NETS: [VDD]
GND_NETS: [VSS]
PDN_CORE_RING: true
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5
PDN_CORE_RING_VOFFSET: 5
PDN_CORE_RING_HOFFSET: 5
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

PDK: gf180mcuD
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0

CLOCK_PORT: clk
CLOCK_PERIOD: 100

# The clock is defined on the core side of the input pad (pad_w_in_0/Y); see
# the SDC. Used for both PnR and signoff.
PNR_SDC_FILE: "dir::chip_top.sdc"
SIGNOFF_SDC_FILE: "dir::chip_top.sdc"

# Die width chosen so LibreLane's default pad_cfg.tcl divisibility check passes
# on every side: with uniform 75 µm pads + 355 µm corners, per-side spacing must
# be an integer multiple of the 1 µm pad site.  2935 fails the 16-pad sides
# (space_side = 62.5); 2936 yields integer spacing for both 16- and 12-pad sides.
DIE_AREA: [0, 0, 2936, 2936]
# The core MUST be carved out to sit inside the pad ring. Pads are 350 µm deep
# (corners 355 µm) placed flush at the die edge, so the inner core region starts
# ~355 µm in. Using a 380 µm margin leaves room for the PDN core ring. Without
# this, the auto-derived core fills the whole die and overlaps the pads, causing
# millions of DRC/overlap errors.
# 442 µm margin (matches the sscs workshop) so the 25 µm Metal2 core power ring
# clears the pad-ring Metal2 with legal wide-metal spacing. The earlier 380 µm
# margin was sized before a real core ring existed and crams the ring against the
# pads (thousands of M2.2 spacing violations).
CORE_AREA: [442, 442, 2494, 2494]
FP_SIZING: absolute

# Use LibreLane's built-in PDN generator (proven on the GF180 Classic flow).
# The previous custom pdn_cfg.tcl only set deprecated OpenLane-1 FP_PDN_* env
# vars and never built a complete grid, leaving std-cell well-bias pins
# (VNW/VPW) and decap cells unconnected -> LVS mismatches. The default grid
# connects VDD/VSS + VNW/VPW correctly.

# The core fills nearly the whole die (pad-limited design) while the logic is
# tiny, so global routing reports minor localized congestion (~0.02% usage).
# Allow it through to detailed routing, which resolves it; DRC/LVS still run.
GRT_ALLOW_CONGESTION: true

VERILOG_FILES:
  - "dir::../src/chip_top.sv"
  - "dir::../src/chip_core.sv"
  - "dir::../src/slot_defines.svh"

# gf180mcu_fd_io.v uses Verilog-1995 transistor-level primitives (rnmos/rpmos)
# that Verilator rejects but Yosys handles fine. Strategy:
#   - QUIT_ON_LINTER_ERRORS: false  → Verilator lint errors are non-fatal
#   - VERILOG_FILES_BLACKBOX        → Yosys sees the pad cells as black boxes
#     so it can elaborate chip_top without needing the transistor internals.
QUIT_ON_LINTER_ERRORS: false

# This workshop fixture deliberately leaves most pads unconnected (30 spare
# analog + 17 spare bidirectional) and relies on connect_by_abutment for the
# pad-ring power rails, so their pins are "disconnected" at the netlist level.
# That is expected for a spare-pad demo — downgrade the connectivity checker to
# a warning. DRC (TrDRC) and LVS still run and must pass; this does not weaken
# physical signoff.
ERROR_ON_DISCONNECTED_PINS: false

# The pad-ring power is now strapped into the core PDN (connect_to_pads), so the
# IR-drop analysis has a real grid to work on — re-enabled as a signoff report.
RUN_IRDROP_REPORT: true

# The pad-ring power is now PHYSICALLY strapped to the core PDN via the Metal2/
# Metal3 core ring with PDN_CORE_RING_CONNECT_TO_PADS (above), so the previous
# pad-ring<->core power mismatch is gone: signoff is fully clean (LVS "Circuits
# match uniquely", 0 Magic DRC, 0 illegal overlap, 0 route DRC). This downgrade is
# kept only for the intentionally-spare unconnected pads' fill/decap power pins,
# which netgen lists as disconnected nodes; it does not mask any pad-ring<->core
# power issue anymore. Re-enabled as a hard gate now that the grid is real.
ERROR_ON_PDN_VIOLATIONS: true

VERILOG_FILES_BLACKBOX:
  - "dir::../gf180mcu_fd_io_yosys.v"

EXTRA_LEFS: []
EXTRA_GDS: []

# ---------------------------------------------------------------------------
# GF180 I/O pad library for OpenROAD.PadRing
# ---------------------------------------------------------------------------
# LibreLane's default pad_cfg.tcl generator is used (PAD_CFG is intentionally
# left UNSET — it is a Tcl script, not a YAML layout).  The gf180mcuD PDK ships
# no LibreLane pad config, so every pad variable below is supplied here.
#
# The IO cell LEFs/GDS are NOT part of the PDK's std-cell LEF set, so they must
# be loaded explicitly (pdk_dir:: resolves to $PDK_ROOT/gf180mcuD; the glob
# expands to a file list).
PAD_LEFS:
  - "pdk_dir::libs.ref/gf180mcu_fd_io/lef/*.lef"
PAD_GDS:
  - "pdk_dir::libs.ref/gf180mcu_fd_io/gds/gf180mcu_fd_io.gds"
# SPICE models for the IO pad + filler cells so netgen LVS can resolve their
# connectivity instead of black-boxing them (otherwise the pad-ring filler
# power pins produce spurious net mismatches).
PAD_SPICE_MODELS:
  - "pdk_dir::libs.ref/gf180mcu_fd_io/spice/gf180mcu_fd_io.spice"

# GF180 IO pad sites (GF_IO_Site / GF_COR_Site) are referenced by the cell LEFs
# but never defined in any LEF, so they must be declared as fake sites.
# Dimensions: IO cells are 75 x 350 µm (site tiles at the 1 µm filler grid);
# corner cell gf180mcu_fd_io__cor is 355 x 355 µm.
PAD_SITE_NAME: GF_IO_Site
PAD_CORNER_SITE_NAME: GF_COR_Site
PAD_FAKE_SITES:
  GF_IO_Site: [1, 350]
  GF_COR_Site: [355, 355]

PAD_CORNER:
  - gf180mcu_fd_io__cor
PAD_FILLERS:
  - gf180mcu_fd_io__fill10
  - gf180mcu_fd_io__fill5
  - gf180mcu_fd_io__fill1

# Place top-level I/O terminals on the pads that carry signals so the Chip flow
# can locate the top ports (clk/rst_n/dout).  Without this, OpenROAD global
# placement fails with "toplevel port is not placed".  Format is master/pin.
PAD_PLACE_IO_TERMINALS:
  - gf180mcu_fd_io__in_s/PAD
  - gf180mcu_fd_io__bi_24t/PAD

# Physical pad placement — per-side instance ordering
# These are PHYSICAL INSTANCE NAMES matching the RTL (chip_top.sv)
PAD_SOUTH:
  - pad_s_analog_0
  - pad_s_analog_1
  - pad_s_analog_2
  - pad_s_analog_3
  - pad_s_analog_4
  - pad_s_analog_5
  - pad_s_analog_6
  - pad_s_analog_7
  - pad_s_analog_8
  - pad_s_analog_9
  - pad_s_analog_10
  - pad_s_analog_11
  - pad_s_analog_12
  - pad_s_analog_13
  - pad_s_analog_14
  - pad_s_dvss_0

PAD_EAST:
  - pad_e_bi_0
  - pad_e_bi_1
  - pad_e_bi_2
  - pad_e_bi_3
  - pad_e_bi_4
  - pad_e_bi_5
  - pad_e_bi_6
  - pad_e_bi_7
  - pad_e_bi_8
  - pad_e_bi_9
  - pad_e_dvdd_0
  - pad_e_dvss_1

PAD_NORTH:
  - pad_n_analog_15
  - pad_n_analog_16
  - pad_n_analog_17
  - pad_n_analog_18
  - pad_n_analog_19
  - pad_n_analog_20
  - pad_n_analog_21
  - pad_n_analog_22
  - pad_n_analog_23
  - pad_n_analog_24
  - pad_n_analog_25
  - pad_n_analog_26
  - pad_n_analog_27
  - pad_n_analog_28
  - pad_n_analog_29
  - pad_n_dvdd_1

PAD_WEST:
  - pad_w_bi_10
  - pad_w_bi_11
  - pad_w_bi_12
  - pad_w_bi_13
  - pad_w_bi_14
  - pad_w_bi_15
  - pad_w_bi_16
  - pad_w_bi_17
  - pad_w_bi_18
  - pad_w_bi_19
  - pad_w_in_0
  - pad_w_in_1
  - pad_w_dvdd_2
  - pad_w_dvdd_3
  - pad_w_dvss_2
  - pad_w_dvss_3

# Remaining analog pads distributed on south continued
# (total 60 analog = 15 south + 15 north + 15 south_ext + 15 north_ext)
# For simplicity in this workshop config, we show the primary sides above

# GF180 Chipathon Workshop — LibreLane Chip flow configuration
#
# Golden test fixture: 60 analog + 20 bidirectional + 4 DVDD + 4 DVSS
# + 2 input + 4 corner pads on a 2935 x 2935 µm die.
#
# This is the WORKSHOP-SPECIFIC configuration.  Generic Chip Orchestra
# pad-ring configs are parameterized by the user's actual I/O requirements.

meta:
  flow: Chip
  version: 2

DESIGN_NAME: chip_top
DESIGN_IS_CORE: false

PDK: gf180mcuD
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0

CLOCK_PORT: clk
CLOCK_PERIOD: 100

DIE_AREA: "0 0 2935 2935"
FP_SIZING: absolute

PDN_CFG: "dir::librelane/pdn_cfg.tcl"

VERILOG_FILES:
  - "dir::src/chip_top.sv"
  - "dir::src/chip_core.sv"
  - "dir::src/slot_defines.svh"

EXTRA_LEFS: []
EXTRA_GDS_FILES: []

# Pad configuration (workshop-specific cell from GF180 PDK)
PAD_CFG: "dir::librelane/slots/slot_workshop.yaml"

# Physical pad placement — per-side instance ordering
# These are PHYSICAL INSTANCE NAMES matching the RTL (chip_top.sv)
PAD_SOUTH:
  - pad_s_analog_0
  - pad_s_analog_1
  - pad_s_analog_2
  - pad_s_analog_3
  - pad_s_analog_4
  - pad_s_analog_5
  - pad_s_analog_6
  - pad_s_analog_7
  - pad_s_analog_8
  - pad_s_analog_9
  - pad_s_analog_10
  - pad_s_analog_11
  - pad_s_analog_12
  - pad_s_analog_13
  - pad_s_analog_14
  - pad_s_dvss_0

PAD_EAST:
  - pad_e_bi_0
  - pad_e_bi_1
  - pad_e_bi_2
  - pad_e_bi_3
  - pad_e_bi_4
  - pad_e_bi_5
  - pad_e_bi_6
  - pad_e_bi_7
  - pad_e_bi_8
  - pad_e_bi_9
  - pad_e_dvdd_0
  - pad_e_dvss_1

PAD_NORTH:
  - pad_n_analog_15
  - pad_n_analog_16
  - pad_n_analog_17
  - pad_n_analog_18
  - pad_n_analog_19
  - pad_n_analog_20
  - pad_n_analog_21
  - pad_n_analog_22
  - pad_n_analog_23
  - pad_n_analog_24
  - pad_n_analog_25
  - pad_n_analog_26
  - pad_n_analog_27
  - pad_n_analog_28
  - pad_n_analog_29
  - pad_n_dvdd_1

PAD_WEST:
  - pad_w_bi_10
  - pad_w_bi_11
  - pad_w_bi_12
  - pad_w_bi_13
  - pad_w_bi_14
  - pad_w_bi_15
  - pad_w_bi_16
  - pad_w_bi_17
  - pad_w_bi_18
  - pad_w_bi_19
  - pad_w_in_0
  - pad_w_in_1
  - pad_w_dvdd_2
  - pad_w_dvdd_3
  - pad_w_dvss_2
  - pad_w_dvss_3

# Remaining analog pads distributed on south continued
# (total 60 analog = 15 south + 15 north + 15 south_ext + 15 north_ext)
# For simplicity in this workshop config, we show the primary sides above

# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "NanoCGRA 3x3"
  team: "Chip Orchestra"
  discord: "rads"
  description: "A compact 3x3 coarse-grained reconfigurable array with 32-byte SRAM and a UART-only interface, implemented in GF180MCU."
  lvs_config: "output/nanocgra_lite_3x3_opt/lvs_config.json"
  gf_def_ready: false          # block-level DEF/GDS; GF pad-frame DEF is not included
  ws_def_ready: false          # block-level DEF/GDS; wafer-space pad-frame DEF is not included
  drc_ready: true               # GF180MCU DRC report is clean
  lvs_ready: true               # device and standard-cell LVS sign-off is clean
  export_control: "documents/Export_Control_GF_Rev8.2.docx"   # Required export control document

pins:
  - name: vss
    io_type: ground
  - name: clk
    io_type: input_schmitt
  - name: rst_n
    io_type: input_cmos
  - name: uart_rx
    io_type: input_cmos
  - name: uart_tx
    io_type: bidirectional
  - name: vdd
    io_type: power
